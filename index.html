    <!-- Filter out Vite HMR WebSocket connection errors as per environment instructions ("HMR: Disabled. Ignore WebSocket errors.") -->
    <script type="text/javascript">
      (function() {
        var origError = console.error;
        console.error = function() {
          var msg = arguments && arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite-hmr') !== -1)) {
            return;
          }
          return origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var msg = arguments && arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1)) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
      })();
    </script>
    <!-- GitHub Pages Single Page Apps script redirect decoder -->
    <script type="text/javascript">
      (function(l) {
        if (l.search && l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
